name: put-pdn
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      # Install the CUDA-appropriate PyTorch 2.1 build for the target machine.
      - numpy==1.26.4
      - scipy==1.13.1
      - h5py==3.14.0
      - opencv-python==4.12.0.88
      - einops==0.8.1
      - tifffile==2024.8.30
      - scikit-image==0.24.0
      - imgvision==0.1.7.3
